<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QreTab</title>
    <link rel="stylesheet" href="./styles/newtab.css" />
  </head>
  <body>
    <div class="bg-glow"></div>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="greeting" id="greeting">晚上好，7ING</p>
          <p class="date-time"><span id="dateText"></span> · <span id="timeText"></span></p>
        </div>
      </header>

      <section class="search-area">
        <form id="searchForm" class="search-form" autocomplete="off">
          <label class="hidden" for="searchInput">搜索</label>
          <select id="engineSelect" class="engine-select" title="搜索引擎">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="duckduckgo">DuckDuckGo</option>
          </select>
          <input id="searchInput" type="text" placeholder="输入关键词后回车" />
          <button id="searchSubmitBtn" class="primary-btn" type="submit">搜索</button>
        </form>
      </section>

      <section class="bookmarks-area">
        <div class="section-title-row">
          <h2 id="entryTitle">访问入口</h2>
          <div class="section-actions">
            <button id="refreshFoldersBtn" class="ghost-btn hidden-block" type="button">刷新</button>
            <button id="addFolderBtn" class="ghost-btn" type="button">新增分组</button>
          </div>
        </div>
        <div id="folderGrid" class="folder-grid"></div>

        <div id="activeFolderPanel" class="active-folder-panel hidden-block">
          <div class="active-folder-head">
            <div>
              <h3 id="activeFolderName">未选择分组</h3>
            </div>
            <button id="addBookmarkBtn" class="primary-btn" type="button">新增网址</button>
          </div>
          <div id="bookmarkRow" class="bookmark-row"></div>
        </div>
      </section>
    </main>

    <button id="settingsBtn" class="floating-settings-btn" type="button" aria-label="设置" title="设置">⚙️</button>

    <dialog id="settingsDialog" class="settings-dialog">
      <form method="dialog" class="dialog-header">
        <h3 id="settingsTitle">QreTab 设置</h3>
        <button id="settingsCloseBtn" class="ghost-btn" value="cancel">关闭</button>
      </form>

      <div class="dialog-content">
        <label id="themeLabel" for="themeSelect">主题模式</label>
        <select id="themeSelect">
          <option id="themeAutoOption" value="auto">跟随系统</option>
          <option id="themeLightOption" value="light">浅色</option>
          <option id="themeDarkOption" value="dark">深色</option>
        </select>

        <label id="settingsEngineLabel" for="settingsEngineSelect">默认搜索引擎</label>
        <select id="settingsEngineSelect">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="duckduckgo">DuckDuckGo</option>
        </select>

        <label id="languageLabel" for="languageSelect">语言</label>
        <select id="languageSelect">
          <option id="languageZhOption" value="zh">中文</option>
          <option id="languageEnOption" value="en">English</option>
        </select>
      </div>
    </dialog>

    <dialog id="folderDialog" class="settings-dialog">
      <form method="dialog" class="dialog-header">
        <h3 id="folderDialogTitle">新增分组</h3>
        <button id="folderCloseBtn" class="ghost-btn" value="cancel">关闭</button>
      </form>

      <form id="folderForm" class="dialog-content">
        <label id="folderNameLabel" for="folderNameInput">分组名称</label>
        <input id="folderNameInput" type="text" maxlength="40" placeholder="例如：AI" required />
        <button id="folderCreateBtn" class="primary-btn" type="submit">创建</button>
      </form>
    </dialog>

    <dialog id="bookmarkDialog" class="settings-dialog">
      <form method="dialog" class="dialog-header">
        <h3 id="bookmarkDialogTitle">新增网址到当前分组</h3>
        <button id="bookmarkCloseBtn" class="ghost-btn" value="cancel">关闭</button>
      </form>

      <form id="bookmarkForm" class="dialog-content">
        <label id="bookmarkTitleLabel" for="bookmarkTitleInput">网址名称</label>
        <input id="bookmarkTitleInput" type="text" maxlength="80" placeholder="例如：ChatGPT" required />

        <label id="bookmarkUrlLabel" for="bookmarkUrlInput">网址</label>
        <input id="bookmarkUrlInput" type="text" placeholder="例如：chatgpt.com" required />

        <button id="bookmarkSaveBtn" class="primary-btn" type="submit">保存</button>
      </form>
    </dialog>

    <div id="folderContextMenu" class="context-menu hidden-block" role="menu" aria-label="Folder actions">
      <button id="folderRenameAction" class="context-menu-item" type="button">重命名分组</button>
      <button id="folderDeleteAction" class="context-menu-item danger" type="button">删除分组</button>
    </div>

    <div id="bookmarkContextMenu" class="context-menu hidden-block" role="menu" aria-label="Bookmark actions">
      <button id="bookmarkRenameAction" class="context-menu-item" type="button">重命名网址</button>
      <button id="bookmarkDeleteAction" class="context-menu-item danger" type="button">删除网址</button>
    </div>

    <script src="./scripts/newtab.js"></script>
  </body>
</html>
